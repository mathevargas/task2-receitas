<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>


    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="login-page">

<div class="container">


    <div class="header" style="justify-content: center;">
        <h1 style="text-align: center; white-space: nowrap;">
            Gerenciamento de Receitas
        </h1>
    </div>

    <div class="card" style="max-width: 350px; margin: 0 auto;">

        <h2 style="text-align: center;">Login</h2>

        <form method="post" action="/login">

            <div class="field" style="margin-bottom: 12px;">
                <input type="text" name="login" placeholder="Login" required>
            </div>

            <div class="field" style="margin-bottom: 12px;">
                <input type="password" name="senha" placeholder="Senha" required>
            </div>

            <button type="submit" class="btn-primary" style="width: 100%; margin-top: 5px;">
                Entrar
            </button>

        </form>

        <p class="erro" th:text="${erro}" style="text-align: center;"></p>

    </div>

</div>

</body>
</html>
