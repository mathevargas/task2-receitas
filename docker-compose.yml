services:
  jenkins:
    build:
      context: .
      dockerfile: jenkins/Dockerfile
    image: task2-receitas-jenkins:latest
    container_name: jenkins
    restart: unless-stopped
    user: root
    environment:
      CASC_JENKINS_CONFIG: /usr/share/jenkins/ref/casc.yaml
      JAVA_OPTS: -Djenkins.install.runSetupWizard=false
      JENKINS_ADMIN_USER: ${JENKINS_ADMIN_USER:-admin}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:-${jenkins_admin_password:?jenkins_admin_password obrigatoria}}
      EMAIL_APP: ${EMAIL_APP:-${email_app:?email_app obrigatoria}}
      SENHA_EMAIL_APP: ${SENHA_EMAIL_APP:-${senha_email_app:?senha_email_app obrigatoria}}
    ports:
      - "8090:8080"
    volumes:
      - jenkins-home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db-test:
        condition: service_healthy
    networks:
      - integration-network
    profiles:
      - integration

  db-test:
    image: postgres:17
    container_name: db-test
    restart: unless-stopped
    profiles:
      - integration
    environment:
      POSTGRES_DB: receitas_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Postgres
    ports:
      - "5433:5432"
    networks:
      - integration-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d receitas_test"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-homolog:
    image: postgres:17
    container_name: db-homolog
    restart: unless-stopped
    profiles:
      - homolog
    environment:
      POSTGRES_DB: receitas_homolog
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Postgres
    volumes:
      - pgdata-homolog:/var/lib/postgresql/data
    networks:
      - homolog-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d receitas_homolog"]
      interval: 10s
      timeout: 5s
      retries: 5

  app-homolog:
    build:
      context: .
      dockerfile: Dockerfile
    image: task2-receitas:latest
    container_name: app-homolog
    restart: unless-stopped
    profiles:
      - homolog
    depends_on:
      db-homolog:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-homolog:5432/receitas_homolog
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: Postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      SPRING_JPA_SHOW_SQL: "true"
      SPRING_THYMELEAF_CACHE: "false"
      SERVER_PORT: 8080
      EMAIL: ${EMAIL:-}
      SENHA_EMAIL: ${SENHA_EMAIL:-}
    ports:
      - "8080:8080"
    networks:
      - homolog-network

  db-prod:
    image: postgres:17
    container_name: db-prod
    restart: unless-stopped
    profiles:
      - prod
    environment:
      POSTGRES_DB: receitas_prod
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Postgres
    volumes:
      - pgdata-prod:/var/lib/postgresql/data
    networks:
      - prod-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d receitas_prod"]
      interval: 10s
      timeout: 5s
      retries: 5

  app-prod:
    build:
      context: .
      dockerfile: Dockerfile
    image: task2-receitas:latest
    container_name: app-prod
    restart: unless-stopped
    profiles:
      - prod
    depends_on:
      db-prod:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-prod:5432/receitas_prod
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: Postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      SPRING_JPA_SHOW_SQL: "true"
      SPRING_THYMELEAF_CACHE: "false"
      SERVER_PORT: 8080
      EMAIL: ${EMAIL:-}
      SENHA_EMAIL: ${SENHA_EMAIL:-}
    ports:
      - "8081:8080"
    networks:
      - prod-network

volumes:
  jenkins-home:
  pgdata-homolog:
  pgdata-prod:

networks:
  integration-network:
  homolog-network:
  prod-network:
